  <script id="fixtech-khmer-webfont-runtime-v627">
  (function(){
    "use strict";
    var KHMER_TEST = /[\u1780-\u17FF\u19E0-\u19FF]/;
    var KHMER_RUN = /([\u1780-\u17FF\u19E0-\u19FF]+)/g;
    var SKIP = {SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1,SELECT:1,OPTION:1,NOSCRIPT:1,CODE:1,PRE:1};
    var busy = false;

    function shouldSkip(node){
      var p = node && node.parentElement;
      if(!p || SKIP[p.tagName]) return true;
      if(p.classList && p.classList.contains("fixtech-khmer-webfont")) return true;
      if(p.closest && p.closest(".fixtech-khmer-webfont")) return true;
      return !KHMER_TEST.test(node.nodeValue || "");
    }

    function wrapTextNode(node){
      if(shouldSkip(node)) return;
      var value = node.nodeValue || "";
      var parts = value.split(KHMER_RUN);
      if(parts.length < 2) return;
      var frag = document.createDocumentFragment();
      for(var i=0;i<parts.length;i++){
        var part = parts[i];
        if(!part) continue;
        if(KHMER_TEST.test(part)){
          var span = document.createElement("span");
          span.className = "fixtech-khmer-webfont";
          span.lang = "km";
          span.textContent = part;
          frag.appendChild(span);
        }else{
          frag.appendChild(document.createTextNode(part));
        }
      }
      node.parentNode.replaceChild(frag,node);
    }

    function apply(root){
      if(!root || busy) return;
      busy = true;
      try{
        if(root.nodeType === 3){ wrapTextNode(root); return; }
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
        var nodes = [], n;
        while((n = walker.nextNode())){
          if(!shouldSkip(n)) nodes.push(n);
        }
        for(var i=0;i<nodes.length;i++) wrapTextNode(nodes[i]);
      }finally{ busy = false; }
    }

    function start(){
      apply(document.body);
      var observer = new MutationObserver(function(mutations){
        if(busy) return;
        for(var i=0;i<mutations.length;i++){
          var m = mutations[i];
          if(m.type === "characterData"){
            apply(m.target);
          }else{
            for(var j=0;j<m.addedNodes.length;j++) apply(m.addedNodes[j]);
          }
        }
      });
      observer.observe(document.body,{childList:true,subtree:true,characterData:true});
    }

    if(document.readyState === "loading") document.addEventListener("DOMContentLoaded",start,{once:true});
    else start();
  })();
  </script>
